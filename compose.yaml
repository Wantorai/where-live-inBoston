name: boston-map

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2); assert response.status == 200 and json.load(response) == {'status': 'ok'}"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
